  <!-- Навигационное меню -->
  <nav>
    <ul>
      <li><a href="index.html">Главная</a></li>

    </ul>
  </nav>

  <main>
    <section>
      <h2>Регистрация</h2>

      <!-- Форма регистрации пользователя -->
      <form class="register" action="#" method="post">
        <label for="first-name">Имя</label>
        <input type="text" id="first-name" name="first_name" placeholder="Иван" required
               pattern="[А-Яа-яЁё]{2,30}" title="Только русские буквы, от 2 до 30">

        <label for="last-name">Фамилия</label>
        <input type="text" id="last-name" name="last_name" placeholder="Иванов" required
               pattern="[А-Яа-яЁё]{2,30}" title="Только русские буквы, от 2 до 30">

        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="ivan@mail.ru" required
               pattern="[a-z0-9._]+@[a-z0-9.]+\.[a-z]{2,}" title="Например: ivan@mail.ru">

        <label for="password">Пароль</label>
        <input type="password" id="password" name="password" placeholder="Не менее 8 символов"
               required minlength="8">

        <label for="password2">Подтверждение пароля</label>
        <input type="password" id="password2" name="password2" placeholder="Повторите пароль"
               required minlength="8">

        <label for="gender">Пол</label>
        <select id="gender" name="gender" required>
          <option value="">Выберите</option>
          <option value="m">Мужской</option>
          <option value="f">Женский</option>
        </select>

        <label for="birth">Дата рождения</label>
        <input type="date" id="birth" name="birth" required>

        <label class="agree">
          <input type="checkbox" name="agree" required>
          Согласен на обработку персональных данных
        </label>

        <input type="submit" value="Отправить">
      </form>
    </section>
  </main>

  <!-- Подвал -->
